<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nordify - Transforme imagens na paleta Nord</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>nordify</h1>
            <p class="tagline">Transforme qualquer imagem na paleta Nord com Floyd–Steinberg dithering</p>
        </header>

        <section class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">🖼️</div>
                <p class="upload-text">Arraste uma imagem ou clique para selecionar</p>
                <p class="upload-subtext">PNG, JPG, WebP • Processado 100% no navegador</p>
                <input type="file" id="fileInput" accept="image/*">
            </div>
        </section>

        <section class="loading hidden" id="loadingSection">
            <div class="spinner"></div>
            <p class="loading-text">Processando com dithering...</p>
        </section>

        <section class="results-section hidden" id="resultsSection">
            <div class="preview-grid">
                <div class="preview-card">
                    <h3>Original</h3>
                    <img id="originalImg" alt="Imagem original">
                </div>
                <div class="preview-card">
                    <h3>Nordified</h3>
                    <canvas id="resultCanvas"></canvas>
                </div>
            </div>
            
            <div class="download-section">
                <button class="download-btn" id="downloadBtn">
                    ⬇️ Baixar PNG
                </button>
            </div>
        </section>

        <footer>
            <p>Feito com a paleta <a href="https://www.nordtheme.com/" target="_blank" rel="noopener">Nord</a> • 100% client-side</p>
        </footer>
    </div>

    <script src="js/palette.js"></script>
    <script src="js/dither.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
